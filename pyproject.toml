[project]
name = "api-automation-framework"
version = "0.1.0"
description = "Example pytest-bdd API automation framework with clients, services, validators, and payload builders."
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0.0",
    "allure-pytest>=2.13.0",
    "pytest-bdd>=7.0.0",
    "pytest-html>=4.1.0",
    "requests>=2.31.0",
]
