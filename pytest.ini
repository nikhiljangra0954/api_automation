[pytest]
testpaths = tests
pythonpath = src
addopts =
    -ra
    --alluredir=reports/allure-results
    --clean-alluredir
    --html=reports/api_automation_report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --log-file=reports/logs/pytest.log
    --log-file-level=INFO
    --log-file-format=%(asctime)s|%(levelname)s|%(name)s|%(message)s
markers =
    e2e: end-to-end business journey tests
    api_validation: API contract and functional validation tests
    auth: authentication API tests
    orders: order API tests
